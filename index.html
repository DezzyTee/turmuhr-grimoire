<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#141016"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><title>Turmuhr-Grimoire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Sitzkreis aus Papier-Tokens auf dunklem Samt, darunter Arbeitsbereiche als Reiter. Spielleiter-Werkzeug fürs Handy. */
:root{
  --bg:#f4f2ef; --panel:#ffffff; --sunk:#e9e5e0; --ink:#1e1922; --muted:#6c6370; --line:#d6d0c9;
  --brass:#8a6420; --good:#2f5d9a; --evil:#a8322b; --ok:#2f7a4c; --warn:#a86a12;
  --token:#ffffff; --tokenInk:#141014; --shadow:0 1px 3px #0002;
  --display:'IM Fell English SC',Georgia,serif; --body:'Alegreya Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141016; --panel:#1f1922; --sunk:#2a222e; --ink:#eee6db; --muted:#a49aa6; --line:#3b3240;
  --brass:#d1a95a; --good:#7fa9e6; --evil:#e46a5f; --ok:#6cc08d; --warn:#e3a54a;
  --token:#f3eee6; --tokenInk:#141014; --shadow:0 2px 8px #0008; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141016; --panel:#1f1922; --sunk:#2a222e; --ink:#eee6db; --muted:#a49aa6; --line:#3b3240;
  --brass:#d1a95a; --good:#7fa9e6; --evil:#e46a5f; --ok:#6cc08d; --warn:#e3a54a;
  --token:#f3eee6; --tokenInk:#141014; --shadow:0 2px 8px #0008; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 80px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.25rem;margin:18px 0 8px}h3{font-size:1.05rem}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.phase{font-family:var(--display);font-size:1.1rem;color:var(--brass)}
.saved{font-size:.8rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:8px 0;margin:8px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--bg);font-weight:700}
.btn.bad{border-color:var(--evil);color:var(--evil)}
.btn.sm{padding:3px 8px;font-size:.85rem}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.85rem}
.pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.t-dorf,.t-aussen{color:var(--good)}.t-scherge,.t-daemon{color:var(--evil)}
.hint{border-left:3px solid var(--brass);padding:6px 10px;background:var(--sunk);border-radius:0 8px 8px 0;font-size:.92rem;margin:6px 0}
.hint.bad{border-color:var(--evil)}.hint.ok{border-color:var(--ok)}
/* Sitzkreis */
.circlebox{position:relative;width:min(100%,640px);aspect-ratio:1;margin:44px auto 64px;max-width:100%}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(62px,15%,96px);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;color:var(--ink)}
.disc{width:100%;aspect-ratio:1;border-radius:50%;background:var(--token);color:var(--tokenInk);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow);border:3px solid var(--good);position:relative}
.disc.evil{border-color:var(--evil)}
.disc img{width:78%;height:78%;object-fit:contain}
.disc .ini{font-family:var(--display);font-size:1.6rem}
.seat.dead .disc{filter:grayscale(1) brightness(.55)}
.seat.dead .disc::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,#000a 56%)}
.seat .nm{font-weight:700;font-size:.85rem;max-width:110px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .rl{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.1}
.seat .num{position:absolute;top:-4px;left:-4px;background:var(--ink);color:var(--bg);border-radius:999px;font-size:.7rem;min-width:20px;padding:0 5px;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:120px}
.tag{font-size:.62rem;padding:0 5px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.tag.v{background:var(--evil);color:var(--bg);border-color:var(--evil)}
.tag.g{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.ghost{font-size:.72rem;color:var(--brass)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;text-align:center}
.center .big{font-family:var(--display);font-size:clamp(1rem,3.4vw,1.5rem)}
/* Sheet */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:88vh}
dialog::backdrop{background:#0008}
.sheet{padding:14px;overflow:auto;max-height:88vh}
.sheet .head{display:flex;gap:10px;align-items:center}
.sheet .head .disc{width:64px;flex:none}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--sunk);font-size:.88rem}
.chk input{margin:0}
.entry{border-top:1px solid var(--line);padding:6px 0;font-size:.9rem}
.entry b{font-family:var(--display);font-weight:400;color:var(--brass)}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;font-size:.92rem;vertical-align:top}
.tablewrap{overflow-x:auto}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.4rem;min-width:3ch}
.talk.done{opacity:.6}
.voters{display:flex;flex-wrap:wrap;gap:4px}
.voter{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 9px;font-size:.85rem}
.voter[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.voter.deadv{border-style:dashed}
.banner{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-family:var(--display);font-size:1.2rem;margin:10px 0}
.step{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.step .n{font-family:var(--display);font-size:1.3rem;color:var(--brass)}
.rtip{border-bottom:1px dotted currentColor;cursor:help}
#tip{position:fixed;z-index:50;max-width:min(340px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1px solid var(--brass);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:.9rem}
#tip h4{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:0 0 2px}
#tip .st{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin-top:8px}
.qr svg{display:block;width:min(260px,70vw);height:auto}
.scr{text-align:left;font:inherit;color:inherit;cursor:pointer}
.scr.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.start{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:20px}
.start button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;text-align:center;font:inherit;color:inherit;cursor:pointer}
.start .disc{width:110px}
.start h2{margin:0}
.prow{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.guess{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.guess button{border:0;background:var(--sunk);padding:4px 10px;font:inherit;font-size:.85rem;color:inherit;cursor:pointer}
.guess button[aria-pressed="true"].g{background:var(--good);color:var(--bg)}
.guess button[aria-pressed="true"].b{background:var(--evil);color:var(--bg)}
.guess button[aria-pressed="true"].q{background:var(--ink);color:var(--bg)}
.pcard.dead{opacity:.75}
.pcard.dead h3::after{content:" · tot";color:var(--evil);font-family:var(--body);font-size:.85rem}
.rlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rl{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.rl .disc{width:52px;border-width:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Turmuhr-Grimoire</h1><div class="phase" id="phaseLbl"></div></div>
    <div class="row"><span class="saved" id="saved">nicht gespeichert</span><button class="btn sm" data-mode="switch" id="modeBtn">Ansicht wechseln</button><button class="btn sm bad" data-reset="ask">Zurücksetzen</button></div>
  </header>
  <div id="resetBar" hidden class="card" style="border-color:var(--evil);margin-top:8px"><p style="margin:0 0 8px">Alles auf diesem Gerät löschen: Spiel, Spieler, Notizen und Spieler-Ansicht. Danach startet die App wie beim ersten Öffnen.</p><div class="row"><button class="btn bad" data-reset="yes">Ja, alles zurücksetzen</button><button class="btn" data-reset="no">Abbrechen</button></div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="tip" role="tooltip" hidden></div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>//---------------------------------------------------------------------
//

//

//

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

willing", "team": "scherge", "ability": "Du und ein guter Spieler kennt euch als Zwillinge. Gut kann nicht gewinnen, solange ihr beide lebt. Wird der gute Zwilling hingerichtet, gewinnt Böse.", "timing": "1. Nacht", "choice": "", "st": "1. Nacht: Beide Zwillinge erfahren sich gegenseitig samt Rolle."}, {"id": "hexe", "name": "Hexe", "team": "scherge", "ability": "Jede Nacht wählst du einen Spieler: Nominiert er morgen, stirbt er. Leben nur noch 3 Spieler, verlierst du diese Fähigkeit.", "timing": "Jede Nacht", "choice": "1 Spieler", "st": "Verfluchter nominiert am nächsten Tag: Er stirbt sofort."}, {"id": "cerenovus", "name": "Cerenovus", "team": "scherge", "ability": "Jede Nacht wählst du einen Spieler und eine gute Rolle: Er ist morgen „verrückt“ danach, diese Rolle zu sein, sonst wird er vielleicht hingerichtet.", "timing": "Jede Nacht", "choice": "1 Spieler + Rolle", "st": "Sag dem Spieler, welche Rolle er morgen behaupten muss. Tut er es nicht, darfst du ihn hinrichten lassen."}, {"id": "grubenhexe", "name": "Grubenhexe", "team": "scherge", "ability": "Jede Nacht* wählst du einen Spieler und eine Rolle, die er wird (wenn sie nicht im Spiel ist). Entsteht so ein Dämon, sind die Tode heute Nacht beliebig.", "timing": "Jede Nacht*", "choice": "1 Spieler + Rolle", "st": "Der Spieler wechselt die Rolle. Neuer Dämon: Du bestimmst die Tode dieser Nacht."}, {"id": "fang_gu", "name": "Fang Gu", "team": "daemon", "ability": "Jede Nacht* wählst du einen Spieler: Er stirbt. Der erste Außenseiter, den diese Fähigkeit tötet, wird stattdessen ein böser Fang Gu, und du stirbst. [+1 Außenseiter]", "timing": "Jede Nacht*", "choice": "1 Spieler", "st": "Aufbau: +1 Außenseiter. Erster getöteter Außenseiter springt über und wird Fang Gu."}, {"id": "vigormortis", "name": "Vigormortis", "team": "daemon", "ability": "Jede Nacht* wählst du einen Spieler: Er stirbt. Von dir getötete Schergen behalten ihre Fähigkeit und vergiften einen Dorfbewohner-Nachbarn. [−1 Außenseiter]", "timing":   if (!window.claude || !window.claude.use) { setSaved("offline auf diesem Gerät gespeichert"); return; }
  try{
    const db = await claude.use("db"); const user = await claude.use("user");
    const uid = user && await user.id();
    if (db && uid){
      dbDoc = db.doc("data/users/" + uid + "/grimoire");
      const snap = await dbDoc.get();
      if (snap.exists && !DEMO){ const st = JSON.parse(snap.data().state); if (st && (!S || S.players.length === 0 || confirmSwap(st))) { S = st; render(); } }
      setSaved("mit deinem Konto verbunden");
    }
  }catch(e){ /* bleibt beim Browser-Speicher */ }
}
function confirmSwap(st){ return (st.log||[]).length >= (S.log||[]).length; }

/* ---------- Hilfen ---------- */
const P = id => S.players.find(p => p.id === id);
const alive = () => S.players.filter(p => p.alive);
const nm = id => (P(id) || {}).name || "–";
const roleName = id => (R[id] || {}).name || "–";
const team = p => (R[p.role] || {}).team || "dorf";
const isEvil = p => ["scherge","daemon"].includes(team(p));
const has = (p,t) => (p.tags||[]).includes(t);
const impaired = p => p.role === "trunkenbold" || has(p,"vergiftet");
const actsAs = p => BELIEVER[p.role] ? (p.believes || "") : p.role;
const scriptOf = id => id === "custom" ? CUSTOM : (SCRIPTS.find(x => x.id === id) || SCRIPTS[0]);
const scriptRoleIds = () => S.script === "custom" ? (S.custom || []) : scriptOf(S.script || "tb").roles;
const visible = r => S.onlyScript === false || scriptRoleIds().includes(r.id);
const showRole = p => BELIEVER[p.role] ? (p.believes || p.role) : p.role;
const roleLabel = p => BELIEVER[p.role] ? `${roleName(p.role)} (glaubt ${roleName(p.believes)})` : roleName(p.role);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function log(text, pid){ S.log.push({at:Date.now(), when: phaseText(), text, pid: pid || null}); }
function phaseText(){ return S.phase === "setup" ? "Aufbau" : S.phase === "night" ? (S.n === 1 ? "Erste Nacht" : "Nacht " + S.n) : "Tag " + S.n; }
function icon(role){ const u = ICONS[role]; return u ? `<img src="${u}" alt="">` : `<span class="ini">${esc((R[role]||{name:"?"}).name[0])}</span>`; }
function setTag(p,t,on){ p.tags = (p.tags||[]).filter(x => x !== t); if (on) p.tags.push(t); }
function seatOrder(start){ const n = S.players.length; return S.players.map((_,i) => S.players[(i + start) % n]); }
function neighbors(p){ // nächste lebende Nachbarn
  const n = S.players.length, i = S.players.indexOf(p), res = [];
  for (const d of [-1, 1]){ for (let k = 1; k < n; k++){ const q = S.players[(i + d*k + n*k) % n]; if (q !== p && q.alive){ res.push(q); break; } } }
  return res;
}
function playerSelect(id, val, opts = {}){
  const list = S.players.filter(p => !(opts.notSelf && p.id === opts.self));
  return `<select id="${id}" data-k="${opts.k||""}"><option value="">–</option>${list.map(p => `<option value="${p.id}" ${p.id === val ? "selected" : ""}>${esc(p.seat)} · ${esc(p.name)}${p.alive ? "" : " †"}</option>`).join("")}</select>`;
}
function roleSelect(id, val, filter){
  const groups = ["dorf","aussen","scherge","daemon"];
  return `<select id="${id}"><option value="">–</option>${groups.map(g => `<optgroup label="${TEAMNAME[g]}">${ROLES.filter(r => r.team === g && visible(r) && (!filter || filter(r))).map(r => `<option value="${r.id}" ${r.id === val ? "selected" : ""}>${r.name}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
function inPlay(){ return new Set(S.players.map(p => p.role)); }

function vErkl(){

  return `<div class="card"><h2>Checkliste Erklärrunde</h2><p class="small muted">Stichpunkte in Reihenfolge. Das Schild sagt, welchen Bildschirm du dabei zeigst.</p><div class="row">${DEMO ? `<button class="btn bad" data-act="demoEnd">Demo beenden</button>` : `<button class="btn pri" data-act="demoStart">Testaufbau starten</button>`}<button class="btn" onclick="try{localStorage.removeItem('erkl')}catch(_){};render()">Häkchen löschen</button></div>${groups}</div>`;

function erklTick(el){ let d = []; try{ d = JSON.parse(localStorage.getItem("erkl") || "[]"); }catch(_){} const id = +el.dataset.erkl; d = d.filter(x => x !== id); if (el.checked) d.push(id); try{ localStorage.setItem("erkl", JSON.stringify(d)); }catch(_){} }

function vGrim(){
  if (!S.players.length) return `<div class="card"><h2>Noch kein Spiel</h2><p>Trage unter <b>Aufbau</b> die Spieler in Sitzreihenfolge ein und verteile die Rollen. Oder lade zum Ausprobieren ein Beispiel.</p><div class="row"><button class="btn pri" data-act="goSetup">Zum Aufbau</button><button class="btn" data-act="demo">Beispiel mit 8 Spielern laden</button></div></div>`;
  const n = S.players.length;
  const seats = S.players.map((p,i) => {
    const a = -Math.PI/2 + 2*Math.PI*i/n, x = 50 + 40*Math.cos(a), y = 50 + 40*Math.sin(a);
    const tags = (p.tags||[]).map(t => { const d = TAGS.find(x => x[0] === t); return `<span class="tag ${d ? d[2] : ""}">${d ? d[1] : esc(t)}</span>`; }).join("");
    const rl = BELIEVER[p.role] ? `${esc(roleName(p.role))}<br>glaubt ${esc(roleName(p.believes))}` : esc(roleName(p.role));
    return `<button class="seat ${p.alive ? "" : "dead"}" style="left:${x}%;top:${y}%" data-open="${p.id}" aria-label="${esc(p.name)} öffnen">
      <span class="disc ${isEvil(p) ? "evil" : ""}">${icon(showRole(p))}<span class="num">${p.seat}</span></span>
      <span class="nm">${esc(p.name)}</span><span class="rl">${rl}</span>
      ${!p.alive ? `<span class="ghost">${p.ghost ? "👻 Geisterstimme" : "keine Stimme mehr"}</span>` : ""}
      <span class="tags">${tags}</span></button>`;
  }).join("");
  const bl = S.bluffs.filter(Boolean).map(roleName).join(", ") || "–";
  return `${S.win ? `<div class="banner">${esc(S.win)}</div>` : ""}
  <div class="circlebox">${seats}<div class="center"><div class="big">${phaseText()}</div><div class="small muted">Bluffs: ${esc(bl)}</div>${S.dawn ? `<div class="small" style="margin-top:6px">${esc(S.dawn)}</div>` : ""}</div></div>

}

  const distTxt = d ? `<div class="hint">Verteilung für ${n}: ${d[0]} Dorfbewohner · ${d[1]} Außenseiter · ${d[2]} Schergen · ${d[3]} Dämon (Baron, Pate, Fang Gu und Vigormortis ändern die Außenseiter). <button class="btn sm" data-act="draw">Zufällig aus dem Skript ziehen</button></div>` : "";

/* Infos der ersten Nacht berechnen (Vorschläge) */
function suggest(p, n){
  const role = actsAs(p), fake = impaired(p);
  const others = S.players.filter(q => q !== p);
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const pairWith = (target, label) => { const other = rnd(others.filter(q => q !== target)); const pair = [target, other].sort(() => Math.random() - .5); return `${nm(pair[0].id)} oder ${nm(pair[1].id)} ist <b>${label}</b>`; };
  const warn = fake ? `<div class="hint bad">${p.role === "trunkenbold" ? "Trunkenbold" : "Vergiftet"}: Diese Info darf falsch sein. Erfinde etwas Glaubwürdiges.</div>` : "";
  let txt = "";
  if (n === 1){
    if (role === "waescherin"){ const c = others.filter(q => team(q) === "dorf"); if (c.length){ const t = rnd(c); txt = pairWith(t, roleName(t.role)); } }
    if (role === "bibliothekar"){ const c = others.filter(q => team(q) === "aussen"); if (c.length){ const t = rnd(c); txt = pairWith(t, roleName(t.role)); } else txt = "Zeige <b>0</b>: keine Außenseiter"; }
    if (role === "ermittler"){ const c = others.filter(q => team(q) === "scherge"); if (c.length){ const t = rnd(c); txt = pairWith(t, roleName(t.role)); } }
    if (role === "koch"){ let c = 0; S.players.forEach((q,i) => { if (isEvil(q) && isEvil(S.players[(i+1) % S.players.length])) c++; }); txt = `Zeige <b>${c}</b>`; }
  }
  if (role === "empath"){ txt = `Zeige <b>${neighbors(p).filter(isEvil).length}</b> (Nachbarn: ${neighbors(p).map(q => esc(q.name)).join(", ")})`; }
  if (role === "wahrsager"){ const ch = (S.choices[n-1]||{})[p.id] || {}; if (ch.a && ch.b){ const yes = [P(ch.a), P(ch.b)].some(q => q && (q.role === "imp" || has(q,"hering"))); txt = `${nm(ch.a)} + ${nm(ch.b)}: <b>${yes ? "Ja" : "Nein"}</b>`; } else txt = n === 1 ? "Er wählt jetzt 2 Spieler (unten eintragen), dann Antwort ablesen" : "keine Wahl eingetragen"; }
  if (role === "leichenbestatter" && n > 1){ const ex = P(S.executed[n-1]); txt = ex ? `Zeige <b>${roleName(ex.role)}</b> (${esc(ex.name)})` : "Keine Hinrichtung: keine Info"; }
  if (team(p) === "daemon" && n === 1) txt = `Deine Schergen: <b>${S.players.filter(q => team(q) === "scherge").map(q => esc(q.name)).join(", ")}</b> · Bluffs: <b>${S.bluffs.filter(Boolean).map(roleName).join(", ")}</b>`;
  if (team(p) === "scherge" && n === 1) txt = `Dein Dämon: <b>${S.players.filter(q => team(q) === "daemon").map(q => esc(q.name)).join(", ")}</b>` + (S.players.filter(q => team(q) === "scherge").length > 1 ? ` · weitere Schergen: ${S.players.filter(q => team(q) === "scherge" && q !== p).map(q => esc(q.name)).join(", ")}` : "");
  return (txt ? `<div class="hint">${txt}</div>` : "") + (txt ? warn : "");
}

function vTalk(){

  const first = S.phase === "night" && S.n === 1;

  if (first) list = S.players;
  else { const start = (day - 1) % S.players.length; list = seatOrder(start).filter(p => p.alive || (actsAs(p) === "rabenhueter" && p.diedNight === day)); }

      ${pk.map(x => `<div class="row small">${x.l}: ${(x.role ? roleSelect(`c_${key}_${p.id}_${x.k}`, c[x.k]) : playerSelect(`c_${key}_${p.id}_${x.k}`, c[x.k], {notSelf:x.notSelf, self:p.id})).replace("<select", `<select data-choice="${key}" data-pid="${p.id}" data-k="${x.k}"`)}</div>`).join("")}
      ${rkInfo}

      <div class="row" style="margin-top:6px;justify-content:space-between"><label class="chk"><input type="checkbox" data-done="${key}" data-pid="${p.id}" ${done[p.id] ? "checked" : ""}> erledigt</label><button class="btn sm" data-open="${p.id}">Spieler öffnen</button></div></div>`;
  }).join("");
  const left = list.filter(p => !done[p.id]).length;
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><div><h2 style="margin:0">${first ? "Einzelgespräche der ersten Nacht" : "Sprechstunde Tag " + day}</h2><div class="small muted">${first ? "Sitzreihenfolge, je 2 bis 3 Minuten. Giftmischer-Ziel schon in der bösen Runde eintragen." : "Start bei Platz " + list[0]?.seat + ", jeder ca. 1 Minute. Noch " + left + " offen."}</div></div>
  <div class="row"><span class="timer" id="tmr">${first ? "2:30" : "1:00"}</span><button class="btn" data-act="timer" data-sec="${first ? 150 : 60}">Timer</button></div></div>

  ${first ? `<div class="row" style="margin-top:12px"><button class="btn pri" data-act="toDay1">Alle durch: Tag 1 beginnen</button></div>` : ""}`;
}

function picksFor(p, first){
  const role = actsAs(p), r = R[role]; if (!r) return [];
  if (first && (r.timing.includes("*") || role === "scharlachrote_frau")) return [];
  if (PICK[role]) return PICK[role];
  if (r.choice === "2 Spieler") return [{k:"a",l:"Spieler 1"},{k:"b",l:"Spieler 2"}];
  if (r.choice === "1 Spieler") return [{k:"a",l:"wählt"}];
  if (r.choice === "1 Spieler + Rolle") return [{k:"a",l:"wählt"},{k:"r",l:"Rolle",role:true}];
  if (r.choice === "Rolle") return [{k:"r",l:"Rolle",role:true}];
  return [];
}
function needed(){ return Math.ceil(alive().length / 2); }
function vVote(){
  if (S.phase !== "day") return `<div class="card"><p>Abstimmungen gibt es nur am Tag.</p></div>`;
  const today = S.noms.filter(x => x.day === S.n);
  const need = needed();
  const best = today.reduce((m,x) => Math.max(m, x.votes), 0);
  const top = today.filter(x => x.votes === best && best >= need);
  const block = top.length === 1 ? top[0] : null;
  const rows = today.map((x,i) => `<tr><td>${esc(nm(x.by))}</td><td>${esc(nm(x.on))}</td><td>${x.votes}</td><td>${x.votes >= need ? "✓" : ""}</td></tr>`).join("");
  const usedBy = new Set(today.map(x => x.by)), usedOn = new Set(today.map(x => x.on));
  const cur = S._nom || {};
  const voters = seatOrder(S.players.findIndex(p => p.id === cur.on) + 1 || 0).filter(p => p.alive || p.ghost).map(p => {
    const butler = actsAs(p) === "butler" && p.alive ? " (Butler)" : "";
    return `<button class="voter ${p.alive ? "" : "deadv"}" aria-pressed="${(cur.voters||[]).includes(p.id)}" data-voter="${p.id}">${esc(p.name)}${p.alive ? "" : " 👻"}${butler}</button>`;
  }).join("");
  const virginWarn = cur.on && actsAs(P(cur.on)) === "jungfrau" && !has(P(cur.on),"verbraucht") ? `<div class="hint bad">Jungfrau zum ersten Mal nominiert. ${cur.by && team(P(cur.by)) === "dorf" && P(cur.by).role !== "trunkenbold" && !impaired(P(cur.on)) ? "Der Nominierende ist ein Dorfbewohner: <b>Er wird sofort hingerichtet.</b>" : "Der Nominierende ist kein Dorfbewohner (oder sie ist vergiftet): nichts passiert."} <button class="btn sm" data-act="virgin">Jungfrau anwenden</button></div>` : "";
  return `<h2>Tag ${S.n}: Nominierungen</h2>
  <p class="small muted">Lebende: ${alive().length} · nötig: <b>${need}</b> Stimmen und mehr als jeder andere.</p>
  <div class="card"><div class="row"><span>Nominiert von</span>${playerSelect("nomBy", cur.by).replace("<select", '<select data-nom="by"')}<span>nominiert</span>${playerSelect("nomOn", cur.on).replace("<select", '<select data-nom="on"')}</div>
  ${cur.by && usedBy.has(cur.by) ? `<div class="hint bad">${esc(nm(cur.by))} hat heute schon nominiert.</div>` : ""}${cur.on && usedOn.has(cur.on) ? `<div class="hint bad">${esc(nm(cur.on))} wurde heute schon nominiert.</div>` : ""}${cur.by && P(cur.by) && !P(cur.by).alive ? `<div class="hint bad">Tote dürfen nicht nominieren.</div>` : ""}
  ${virginWarn}
  <p class="small">Hände hoch, im Uhrzeigersinn ab dem Nominierten. Antippen, wer dafür stimmt:</p><div class="voters">${voters}</div>
  <div class="row" style="margin-top:8px"><b>${(cur.voters||[]).length}</b> Stimmen <button class="btn pri" data-act="saveNom" ${cur.by && cur.on ? "" : "disabled"}>Abstimmung speichern</button></div></div>
  <div class="tablewrap"><table style="margin-top:10px"><tr><th>Von</th><th>Gegen</th><th>Stimmen</th><th>≥ ${need}</th></tr>${rows || `<tr><td colspan="4" class="muted">Noch keine Nominierung heute.</td></tr>`}</table></div>
  <div class="card" style="margin-top:10px">${block ? `Auf dem Block: <b>${esc(nm(block.on))}</b> mit ${block.votes} Stimmen.` : (top.length > 1 ? "Gleichstand: niemand wird hingerichtet." : "Niemand auf dem Block.")}
  <div class="row" style="margin-top:8px">${block ? `<button class="btn bad" data-act="execute" data-pid="${block.on}">${esc(nm(block.on))} hinrichten</button>` : ""}<button class="btn pri" data-act="toNight">Nacht beginnen</button></div></div>`;
}

/* Nachtauflösung: Wahl vom Tag n gilt für Nacht n+1 */
function resolveNight(){
  const n = S.n, ch = S.choices[n-1] || {}, ex = P(S.executed[n-1]);
  const steps = []; const deaths = []; const infos = {};
  const by = role => S.players.filter(p => actsAs(p) === role);
  const living = p => p && p.alive;
  // 1 Gift
  if (S.players.some(p => p.role === "giftmischer")) S.players.forEach(p => setTag(p,"vergiftet",false));
  const poisoner = S.players.find(p => p.role === "giftmischer" && p.alive);
  if (poisoner){ const t = P((ch[poisoner.id]||{}).a); if (t){ setTag(t,"vergiftet",true); steps.push(["Giftmischer", `${esc(t.name)} ist vergiftet (diese Nacht und morgen).`]); } else steps.push(["Giftmischer","keine Wahl eingetragen"]); }
  // 2 Mönch
  S.players.forEach(p => setTag(p,"geschuetzt",false));
  by("moench").filter(living).forEach(m => { const t = P((ch[m.id]||{}).a); if (!t) return steps.push(["Mönch","keine Wahl"]); if (impaired(m)) steps.push(["Mönch", `wählte ${esc(t.name)}, wirkt aber nicht (${m.role === "trunkenbold" ? "Trunkenbold" : "vergiftet"}).`]); else { setTag(t,"geschuetzt",true); steps.push(["Mönch", `${esc(t.name)} ist geschützt.`]); } });
  // 3+4 Imp
  let imp = S.players.find(p => p.role === "imp" && p.alive);
  if (!imp) { if (!S.players.some(p => p.alive && team(p) === "daemon")) steps.push(["Dämon","Kein lebender Dämon."]); }
  else {
    const c = ch[imp.id] || {};
    let tgt = P(c.a), why = "Ziel";
    if (imp.newImpFromSW){ tgt = P((ch[imp.id]||{}).a); why = "Vorsorge-Ziel"; }
    if (tgt && ex && tgt.id === ex.id){ tgt = P(c.b); why = "Ersatzopfer (Ziel wurde hingerichtet)"; }
    if (!tgt) steps.push(["Imp", "Keine gültige Wahl: niemand stirbt."]);
    else if (has(imp,"vergiftet")) steps.push(["Imp", `Imp ist vergiftet: ${esc(tgt.name)} überlebt.`]);
    else if (tgt === imp){
      deaths.push(imp); const heir = S.players.find(p => p.alive && p.role === "scharlachrote_frau") || S.players.find(p => p.alive && team(p) === "scherge");
      steps.push(["Imp", `${why} ist der Imp selbst: Er stirbt. ${heir ? `<b>${esc(heir.name)}</b> wird neuer Imp (in der Sprechstunde sagen).` : "Kein Scherge lebt: Gut gewinnt."}`]);
      if (heir) S._heir = heir.id;
    }
    else if (!tgt.alive) steps.push(["Imp", `${why} ${esc(tgt.name)} ist schon tot: niemand stirbt.`]);
    else if (has(tgt,"geschuetzt")) steps.push(["Imp", `${why} ${esc(tgt.name)} ist vom Mönch geschützt: niemand stirbt.`]);
    else if (actsAs(tgt) === "soldat" && tgt.role === "soldat" && !has(tgt,"vergiftet")) steps.push(["Imp", `${why} ${esc(tgt.name)} ist der Soldat: niemand stirbt.`]);
    else if (tgt.role === "buergermeister" && !has(tgt,"vergiftet")) { steps.push(["Imp", `${why} ist der Bürgermeister ${esc(tgt.name)}. Du darfst umlenken: Wähle unten, wer stirbt.`]); deaths.push(tgt); S._mayor = tgt.id; }
    else { deaths.push(tgt); steps.push(["Imp", `${why}: <b>${esc(tgt.name)}</b> stirbt.`]); }
  }
  // Alle anderen Wahlen: von Hand auflösen
  S.players.forEach(p => { const c = ch[p.id]; if (!c || AUTO.has(actsAs(p))) return;
    const parts = [c.a && nm(c.a), c.b && nm(c.b), c.r && roleName(c.r)].filter(Boolean);
    if (parts.length) steps.push([`${roleName(actsAs(p))} · ${esc(p.name)}`, `wählte ${parts.map(esc).join(", ")}. Von Hand auflösen, Tote unten antippen.`]); });
  return {steps, deaths, ex};
}
function infoFor(p){
  const role = actsAs(p), n = S.n, ch = S.choices[n-1] || {};
  if (role === "empath"){ const k = neighbors(p).filter(isEvil).length; return `Zeige ${k}` + (impaired(p) ? " (beeinträchtigt: falsche Zahl geben!)" : ""); }
  if (role === "wahrsager"){ const c = ch[p.id] || {}; if (!c.a || !c.b) return "keine Wahl eingetragen"; const yes = [P(c.a),P(c.b)].some(q => q && (q.role === "imp" || has(q,"hering"))); return `${nm(c.a)} + ${nm(c.b)}: ${yes ? "Ja" : "Nein"}` + (impaired(p) ? " (beeinträchtigt: darf falsch sein)" : ""); }
  if (role === "leichenbestatter"){ const ex = P(S.executed[n-1]); return ex ? `Hingerichtet war: ${roleName(ex.role)}` + (impaired(p) ? " (beeinträchtigt: darf falsch sein)" : "") : "keine Hinrichtung: keine Info"; }
  return "";
}

function vNight(){
  if (S.phase === "setup") return `<div class="card"><p>Noch kein Spiel gestartet.</p></div>`;
  if (S.phase === "night" && S.n === 1) return `<div class="card"><h2>Erste Nacht</h2><ol><li>Alle Augen zu, Musik an.</li><li>Imp und Schergen antippen: Sie sehen sich. Imp bekommt die Bluffs: <b>${S.bluffs.filter(Boolean).map(roleName).join(", ") || "noch keine gewählt"}</b>.</li><li>Giftmischer zeigt sein Ziel: unter Gespräche beim Giftmischer eintragen.</li><li>Augen auf, dann Einzelgespräche im Nebenraum.</li></ol><button class="btn pri" data-tab="talk">Zu den Gesprächen</button></div>`;
  if (S.phase === "day") return `<div class="card"><p>Es ist Tag ${S.n}. Wenn die Abstimmung vorbei ist: <button class="btn pri" data-act="toNight">Nacht beginnen</button></p></div>`;
  const r = S._res;
  if (!r) return `<div class="card"><h2>Nacht ${S.n}</h2><p>Alle machen Pause. Prüfe, ob alle Wahlen von gestern eingetragen sind, dann auflösen.</p><button class="btn pri" data-act="resolve">Nacht auflösen</button></div>`;
  const mayor = S._mayor ? `<div class="row small">Stattdessen stirbt: ${playerSelect("mayorRedirect", S._mayorTo || S._mayor).replace("<select", '<select data-mayor="1"')}</div>` : "";
  const dl = [...r.deaths, ...(S._manual||[])].map(id => esc(nm(id))).join(", ") || "niemand";
  const manual = `<div class="step"><span class="n">+</span><div><b>Weitere Tote (von Hand)</b><div class="voters">${alive().filter(p => !r.deaths.includes(p.id)).map(p => `<button class="voter" aria-pressed="${(S._manual||[]).includes(p.id)}" data-manual="${p.id}">${esc(p.name)}</button>`).join("")}</div></div></div>`;
  const nightRole = p => { const r = R[actsAs(p)]; return r && !AUTO.has(r.id) && /Nacht/.test(r.timing) && r.timing !== "1. Nacht"; };
  const infos = S.players.filter(p => (p.alive || p.diedNight === S.n) && (infoFor(p) || nightRole(p))).map(p => `<div class="row small"><b>${esc(p.name)}</b> (${esc(roleName(actsAs(p)))}): <input type="text" data-info="${p.id}" value="${esc((S.info[S.n]||{})[p.id] || infoFor(p))}" style="flex:1;min-width:200px" aria-label="Info für ${esc(p.name)}"></div>`).join("");
  const rk = S.players.filter(p => actsAs(p) === "rabenhueter" && p.diedNight === S.n);

  ${r.steps.map((s,i) => `<div class="step"><span class="n">${i+1}</span><div><b>${s[0]}</b><div>${s[1]}</div></div></div>`).join("")}
  ${mayor}${manual}
  <div class="step"><span class="n">→</span><div><b>Tote dieser Nacht</b><div>${dl}</div>${rk.length ? `<div class="hint">Rabenhüter ${esc(rk[0].name)} ist gestorben: Er kommt morgen in die Sprechstunde und wählt.</div>` : ""}</div></div>

}

/* ---------- Aktionen ---------- */
function newPlayer(name){ const id = "p" + Math.random().toString(36).slice(2,8); return {id, name, seat: S.players.length + 1, role:"", believes:"", alive:true, ghost:true, tags:[], notes:"", claim:""}; }
function renumber(){ S.players.forEach((p,i) => p.seat = i + 1); }
function kill(p, how){
  if (!p || !p.alive) return;
  p.alive = false; p.ghost = true; p.diedNight = S.phase === "night" ? S.n : null;
  log(`${p.name} stirbt (${how})`, p.id);
  if (p.role === "giftmischer") S.players.forEach(q => setTag(q,"vergiftet",false));
}
function checkWin(){
  const imp = S.players.find(p => team(p) === "daemon" && p.alive);
  if (!imp) S.win = "Gut gewinnt: Der Dämon ist tot.";
  else if (alive().length <= 2) S.win = "Böse gewinnt: Nur noch zwei leben.";
  if (S.win) log(S.win);
}

}
function draw(){
  const n = S.players.length, d = DIST[n]; if (!d){ alertBox("Zufällig ziehen geht für 5 bis 15 Spieler."); return; }
  const ids = scriptRoleIds(), pool = t => ROLES.filter(r => r.team === t && ids.includes(r.id)).sort(() => Math.random() - .5);
  const dem = pool("daemon").slice(0, d[3]), min = pool("scherge").slice(0, d[2]);
  const mods = {baron:2, fang_gu:1, vigormortis:-1, pate: Math.random() < .5 ? 1 : -1};
  let out = d[1]; [...dem, ...min].forEach(r => { if (mods[r.id]) out += mods[r.id]; }); out = Math.max(0, out);
  const tf = n - d[2] - d[3] - out;
  const roles = [...dem, ...min, ...pool("aussen").slice(0, out), ...pool("dorf").slice(0, tf)].map(r => r.id);
  if (roles.length < n || tf < 0){ alertBox("Das Skript hat nicht genug Rollen für diese Verteilung."); return; }
  roles.sort(() => Math.random() - .5);
  S.players.forEach((p,i) => { p.role = roles[i]; p.believes = "";
    if (BELIEVER[p.role]){ const free = pool(BELIEVER[p.role]).filter(r => !roles.includes(r.id)); p.believes = (free[0] || dem[0] || {}).id || ""; } });
  log(`Rollen zufällig gezogen (${scriptOf(S.script).name})`);
}
function applySetup(shuffle){
  const su = SETUPS.find(s => s.n === S.players.length); if (!su) return;
  let roles = [...su.ev, ...su.out, ...su.tf];
  if (shuffle) roles.sort(() => Math.random() - .5);
  S.players.forEach((p,i) => { p.role = roles[i]; p.believes = p.role === "trunkenbold" ? su.drunk : ""; });
}
let tmr = null;
document.addEventListener("click", async e => {
  if (MODE !== "spielleiter") return;
  const t = e.target.closest("[data-tab],[data-act],[data-open],[data-voter],[data-manual]"); if (!t) return;
  if (t.dataset.manual){ const m = S._manual = S._manual || []; const i = m.indexOf(t.dataset.manual); i < 0 ? m.push(t.dataset.manual) : m.splice(i,1); save(); return render(); }
  if (t.dataset.tab){ tab = t.dataset.tab; try{ localStorage.setItem("grimTab", tab); }catch(_){} return render(); }
  if (t.dataset.open){ return openSheet(t.dataset.open); }
  if (t.dataset.voter){ const c = S._nom = S._nom || {}; c.voters = c.voters || []; const i = c.voters.indexOf(t.dataset.voter); i < 0 ? c.voters.push(t.dataset.voter) : c.voters.splice(i,1); return render(); }
  const a = t.dataset.act, pid = t.dataset.pid;
  const dlgPid = document.getElementById("dlg").dataset.pid;
  switch (a){
    case "goSetup": tab = "setup"; break;
    case "demo": demo(); break;
    case "demoStart": demoStart(); break;
    case "demoEnd": demoEnd(); return render();
    case "add": { const v = document.getElementById("newName").value.trim(); if (!v) return; S.players.push(newPlayer(v)); renumber(); break; }
    case "del": S.players = S.players.filter(p => p.id !== pid); renumber(); break;
    case "up": { const i = S.players.findIndex(p => p.id === pid); if (i > 0){ [S.players[i-1], S.players[i]] = [S.players[i], S.players[i-1]]; renumber(); } break; }
    case "applySetup": applySetup(false); break;
    case "script": S.script = t.dataset.sid; if (S.script === "custom" && !(S.custom||[]).length) S.custom = SCRIPTS[0].roles.slice(); break;
    case "draw": draw(); break;
    case "share": { const url = shareLink(); const box = document.getElementById("shareBox");
      let svg = ""; try{ const q = qrcode(0, "L"); q.addData(url); q.make(); svg = q.createSvgTag(4, 2); }catch(_){}
      box.innerHTML = `<div class="hint">${svg ? `<div class="qr">${svg}</div>` : ""}<input type="text" readonly value="${esc(url)}" style="width:100%;margin-top:8px" id="shareUrl" aria-label="Link zum Aufbau"><div class="row" style="margin-top:6px"><button class="btn sm" data-act="copyShare">Link kopieren</button><span class="small muted">Nach jedem Morgen neu zeigen, dann sehen alle die neuen Toten.</span></div></div>`; return; }
    case "copyShare": { const el = document.getElementById("shareUrl"); try{ await navigator.clipboard.writeText(el.value); t.textContent = "Kopiert"; }catch(_){ el.select(); } return; }
    case "shuffle": applySetup(true); break;
    case "autoBluff": { const used = inPlay(); const drunkB = S.players.filter(p => BELIEVER[p.role]).map(p => p.believes); const pool = ROLES.filter(r => r.team === "dorf" && scriptRoleIds().includes(r.id) && !used.has(r.id) && !drunkB.includes(r.id)).sort(() => Math.random() - .5); S.bluffs = pool.slice(0,3).map(r => r.id); break; }
    case "start": if (S.players.some(p => !p.role)) { alertBox("Jeder Spieler braucht eine Rolle."); return; } S.phase = "night"; S.n = 1; log("Erste Nacht beginnt"); tab = "night"; break;
    case "toDay1": S.phase = "day"; S.n = 1; S.dawn = "Tag 1: Niemand ist gestorben."; log("Tag 1 beginnt"); tab = "talk"; break;
    case "timer": { clearInterval(tmr); let s = +t.dataset.sec; const el = document.getElementById("tmr"); tmr = setInterval(() => { s--; if (el) el.textContent = Math.floor(Math.max(s,0)/60) + ":" + String(Math.max(s,0)%60).padStart(2,"0"); if (s <= 0){ clearInterval(tmr); try{ navigator.vibrate && navigator.vibrate(300); }catch(_){} } }, 1000); return; }
    case "saveNom": { const c = S._nom; const votes = (c.voters||[]).length; c.voters.forEach(id => { const p = P(id); if (p && !p.alive) p.ghost = false; }); S.noms.push({day:S.n, by:c.by, on:c.on, votes}); log(`${nm(c.by)} nominiert ${nm(c.on)}: ${votes} Stimmen`, c.on); S._nom = {}; break; }
    case "virgin": { const c = S._nom, v = P(c.on), by = P(c.by); setTag(v,"verbraucht",true); if (team(by) === "dorf" && by.role !== "trunkenbold" && !impaired(v)){ kill(by,"Jungfrau"); S.executed[S.n] = by.id; log(`Jungfrau: ${by.name} sofort hingerichtet`, by.id); checkWin(); } else log(`Jungfrau nominiert von ${by.name}: nichts passiert`, v.id); S._nom = {}; break; }
    case "execute": { const p = P(pid); const before = alive().length; kill(p, "hingerichtet"); S.executed[S.n] = p.id;
      if (p.role === "heiliger" && !has(p,"vergiftet")) { S.win = "Böse gewinnt: Der Heilige wurde hingerichtet."; log(S.win); }
      else if (p.role === "imp"){ const sw = S.players.find(q => q.alive && q.role === "scharlachrote_frau" && !has(q,"vergiftet")); if (sw && before >= 5){ sw.formerRole = sw.role; sw.role = "imp"; sw.newImp = true; sw.newImpFromSW = true; log(`${sw.name} (Scharlachrote Frau) wird Imp`, sw.id); } else checkWin(); }
      else checkWin(); break; }
    case "toNight": S.phase = "night"; S.n += 1; S._res = null; S._mayor = null; S._mayorTo = null; log(`Nacht ${S.n} beginnt`); tab = "night"; break;
    case "resolve": case "reresolve": { S._heir = null; S._mayor = null; if (a === "resolve") S._manual = []; const r = resolveNight(); S._res = {steps:r.steps, deaths:r.deaths.map(p => p.id)};
      // Info-Rollen wachen nach dem Imp auf: Opfer dieser Nacht zählen schon als tot
      r.deaths.forEach(p => p._was = p.alive); r.deaths.forEach(p => p.alive = false);
      S.info[S.n] = {}; S.players.forEach(p => { const s = infoFor(p); if (s) S.info[S.n][p.id] = s; });
      r.deaths.forEach(p => { p.alive = p._was; delete p._was; }); break; }
    case "dawn": { const ids = (S._res && S._res.deaths) || []; const dead = ids.map(id => (S._mayor === id && S._mayorTo) ? P(S._mayorTo) : P(id));
      if (S._heir){ const h = P(S._heir); h.formerRole = h.role; h.role = "imp"; h.newImp = true; log(`${h.name} wird neuer Imp`, h.id); S._heir = null; }
      (S._manual || []).forEach(id => { const q = P(id); if (q && !dead.includes(q)) dead.push(q); }); S._manual = [];
      dead.forEach(p => kill(p, "Nacht " + S.n));
      S.players.forEach(p => { setTag(p,"geschuetzt",false); if (p.newImpFromSW) p.newImpFromSW = false; if (p.newImp && p.newImpTold) { p.newImp = false; } if (p.newImp) p.newImpTold = true; });
      // Infos für Leichen-Rollen nach den Toden neu: Empath-Nachbarn gelten zur Nacht, bleiben wie berechnet
      S.phase = "day"; S.dawn = `Tag ${S.n}: ` + (dead.length ? dead.map(p => p.name).join(", ") + " ist gestorben. Maske auf!" : "Niemand ist gestorben.") + " Ansage: „Die Turmuhr schlägt sechs." + (dead.length ? " Der Schamane zählt die Toten der Nacht …“" : " Heute Nacht hat der Dämon gehungert.“"); log(S.dawn); checkWin(); S._res = null; tab = "talk"; break; }
    case "slay": { const tgt = P(document.getElementById("slayT").value), s = P(dlgPid); if (!tgt) return; setTag(s,"verbraucht",true); if (tgt.role === "imp" && s.role === "schlaechter" && !has(s,"vergiftet")){ kill(tgt,"Schlächter"); log(`Schlächter ${s.name} trifft den Imp ${tgt.name}`, tgt.id); const sw = S.players.find(q => q.alive && q.role === "scharlachrote_frau"); if (sw && alive().length + 1 >= 5){ sw.formerRole = sw.role; sw.role = "imp"; sw.newImp = true; sw.newImpFromSW = true; log(`${sw.name} wird Imp`, sw.id); } else checkWin(); } else log(`Schlächter ${s.name} schießt auf ${tgt.name}: nichts passiert`, s.id); openSheet(dlgPid); break; }
    case "pLog": { const v = document.getElementById("pLog").value.trim(); if (!v) return; log(v, dlgPid); save(); return openSheet(dlgPid); }
    case "addLog": { const v = document.getElementById("logIn").value.trim(); if (!v) return; log(v); break; }
    case "close": document.getElementById("dlg").close(); break;
    case "export": { const txt = JSON.stringify(S); try{ await navigator.clipboard.writeText(txt); document.getElementById("ioBox").innerHTML = `<p class="hint ok">Kopiert. In einer Notiz-App einfügen und aufheben.</p>`; }catch(_){ document.getElementById("ioBox").innerHTML = `<textarea readonly>${esc(txt)}</textarea>`; } return; }
    case "importShow": document.getElementById("ioBox").innerHTML = `<textarea id="impTxt" placeholder="Gespeicherten Stand hier einfügen"></textarea><button class="btn pri" data-act="import">Laden</button>`; return;
    case "import": { try{ const st = JSON.parse(document.getElementById("impTxt").value); if (!st.players) throw 0; S = st; }catch(_){ document.getElementById("ioBox").insertAdjacentHTML("beforeend", `<p class="hint bad">Das ist kein gültiger Spielstand.</p>`); return; } break; }
    case "resetAsk": document.getElementById("ioBox").innerHTML = `<p class="hint bad">Neues Spiel mit denselben Spielern und demselben Skript? Rollen, Notizen und Protokoll werden gelöscht. <button class="btn bad" data-act="reset">Ja, neues Spiel</button></p>`; return;
    case "reset": { const keep = S.players.map(p => p.name); const sc = S.script, only = S.onlyScript, cu = S.custom; S = blank(); S.script = sc; S.onlyScript = only; S.custom = cu; keep.forEach(n => S.players.push(newPlayer(n))); renumber(); tab = "setup"; break; }
    default: return;
  }
  save(); render();
  if (document.getElementById("dlg").open && a !== "close" && dlgPid && P(dlgPid)) openSheet(dlgPid);
});
function alertBox(msg){ document.getElementById("view").insertAdjacentHTML("afterbegin", `<p class="hint bad">${esc(msg)}</p>`); }

document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (MODE !== "spielleiter") return;
  if (d.only){ S.onlyScript = t.checked; save(); return render(); }
  if (d.custom){ S.custom = (S.custom || []).filter(x => x !== d.custom); if (t.checked) S.custom.push(d.custom); save(); return render(); }
  if (d.pf){ const p = P(d.pid); p[d.pf] = t.value; if (d.pf === "role" && t.value === "trunkenbold" && !p.believes) p.believes = "moench"; save(); return render(); }
  if (d.bluff !== undefined){ S.bluffs[+d.bluff] = t.value; return save(); }
  if (t.id === "hering"){ S.players.forEach(p => setTag(p,"hering", p.id === t.value)); return save(); }
  if (d.choice !== undefined){ const k = d.choice; S.choices[k] = S.choices[k] || {}; const c = S.choices[k][d.pid] = S.choices[k][d.pid] || {}; c[d.k] = t.value; const p = P(d.pid);
    if (k === "0" && p.role === "giftmischer"){ S.players.forEach(q => setTag(q,"vergiftet", q.id === t.value)); }
    if (actsAs(p) === "butler"){ S.players.forEach(q => setTag(q,"meister", q.id === t.value)); }
    log(`${p.name} wählt ${d.k === "r" ? roleName(t.value) : nm(t.value)} (${d.k === "b" ? "zweite Wahl" : d.k === "r" ? "Rolle" : "Wahl"})`, p.id); save(); return render(); }
  if (d.done !== undefined){ S.talked[d.done][d.pid] = t.checked; save(); return render(); }
  if (d.nom){ S._nom = S._nom || {}; S._nom[d.nom] = t.value; return render(); }
  if (d.mayor){ S._mayorTo = t.value; return save(); }
  if (d.info){ S.info[S.n] = S.info[S.n] || {}; S.info[S.n][d.info] = t.value; return save(); }
  if (d.talknote){ const v = t.value.trim(); if (v){ log(v, d.talknote); t.value = ""; save(); } return; }
  if (d.claim){ P(d.claim).claim = t.value; return save(); }
  const pid = document.getElementById("dlg").dataset.pid, p = P(pid);
  if (d.sf && p){ p[d.sf] = t.checked; if (d.sf === "alive") log(`${p.name} ${t.checked ? "lebt wieder (korrigiert)" : "als tot markiert"}`, p.id); save(); render(); return openSheet(pid); }
  if (d.st && p){ setTag(p, d.st, t.checked); save(); render(); return openSheet(pid); }
});

/* ---------- Rollen-Tooltips: jeder Rollenname im Text ist antippbar ---------- */
const NAMES = ROLES.map(r => r.name).sort((a,b) => b.length - a.length);
const NAME_RE = new RegExp("(?<![\\p{L}])(" + NAMES.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![\\p{L}])", "u");
const BYNAME = Object.fromEntries(ROLES.map(r => [r.name, r]));
function tipify(root){
  const skip = el => el.closest("input,textarea,select,option,script,style,.rtip,.seat,#tip,.notip");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => (!n.parentElement || skip(n.parentElement) || !NAME_RE.test(n.nodeValue)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const frag = document.createDocumentFragment(); let rest = n.nodeValue, m;
    while ((m = NAME_RE.exec(rest))){
      if (m.index) frag.append(rest.slice(0, m.index));
      const sp = document.createElement("span"); sp.className = "rtip"; sp.tabIndex = 0; sp.dataset.role = BYNAME[m[1]].id; sp.textContent = m[1];
      frag.append(sp); rest = rest.slice(m.index + m[1].length);
    }
    if (rest) frag.append(rest);
    n.replaceWith(frag);
  });
  root.querySelectorAll("option").forEach(o => { const r = R[o.value]; if (r) o.title = r.ability; });
}
function showTip(el){
  const r = R[el.dataset.role]; if (!r) return;
  const tip = document.getElementById("tip"), dlg = document.getElementById("dlg");
  const host = dlg.open ? dlg : document.body; if (tip.parentElement !== host) host.appendChild(tip);
  tip.innerHTML = `<h4>${esc(r.name)}</h4><div class="small"><span class="pill t-${r.team}">${TEAMNAME[r.team]}</span> <span class="muted">${esc(r.timing)}</span></div><div style="margin-top:4px">${esc(r.ability)}</div><div class="st">${esc(r.st)}</div>`;
  tip.hidden = false;
  const b = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = Math.min(Math.max(12, b.left), window.innerWidth - t.width - 12), y = b.bottom + 6;
  if (y + t.height > window.innerHeight - 12) y = Math.max(12, b.top - t.height - 6);
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.dataset.for = el.dataset.role;
}
function hideTip(){ document.getElementById("tip").hidden = true; }
document.addEventListener("click", e => {
  const el = e.target.closest(".rtip");
  if (el){ e.stopPropagation(); e.preventDefault(); const tip = document.getElementById("tip"); (!tip.hidden && tip.dataset.for === el.dataset.role && !matchMedia("(hover: hover)").matches) ? hideTip() : showTip(el); return; }
  if (!e.target.closest("#tip")) hideTip();
}, true);
document.addEventListener("mouseover", e => { const el = e.target.closest(".rtip"); if (el && matchMedia("(hover: hover)").matches) showTip(el); });
document.addEventListener("mouseout", e => { if (e.target.closest(".rtip") && matchMedia("(hover: hover)").matches) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest(".rtip"); if (el) showTip(el); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", hideTip, {passive:true});

  const v = document.getElementById("view");

  return `<div class="card"><div class="row" style="justify-content:space-between"><span>Lebende: <b>${living}</b></span><span>Für eine Hinrichtung nötig: <b>${Math.ceil(living/2)}</b> Stimmen</span></div></div>

  const list = ["dorf","aussen","scherge","daemon"].map(g => `<h2>${TEAMNAME[g]}</h2><div class="rlist">${qRoles().filter(r => r.team === g).map(r => `<div class="rl notip"><span class="disc ${["scherge","daemon"].includes(g) ? "evil" : ""}">${icon(r.id)}</span><div><b>${esc(r.name)}</b> <span class="small muted">${esc(r.timing)}</span><div class="small">${esc(r.ability)}</div></div></div>`).join("")}</div>`).join("");

const meP = () => Q.players.find(x => x.id === Q.meId);
const myRole = () => (meP() ? meP().claim : Q.me.role) || "";
function sureBtn(kind, id, on){ return `<button class="btn sm" data-pact="sure" data-kind="${kind}" data-qid="${id}" aria-pressed="${!!on}" title="sicher oder unsicher">${on ? "✓ sicher" : "? unsicher"}</button>`; }
function pMe(){
  const r = R[myRole()], me = meP(), seat = me ? Q.players.indexOf(me) + 1 : 0;
  const lg = Q.me.log.map((e,i) => `<div class="entry row" style="justify-content:space-between"><span><b>${esc(e.when)}</b> · ${e.sure ? "" : "<i>"}${esc(e.text)}${e.sure ? "" : "</i>"}</span>${sureBtn("log", i, e.sure)}</div>`).reverse().join("");
  return `<h2>Ich</h2><div class="card"><div class="row"><span>Ich bin</span><select data-qwho="1" aria-label="Wer bin ich"><option value="">–</option>${Q.players.map((p,i) => `<option value="${p.id}" ${p.id === Q.meId ? "selected" : ""}>${i+1} · ${esc(p.name)}</option>`).join("")}</select>${seat ? `<span class="pill">Platz ${seat}</span>` : ""}</div>

}
function pNotes(){

document.addEventListener("click", e => {
  const m = e.target.closest("[data-mode]");
  if (m){ setMode(m.dataset.mode === "switch" ? null : m.dataset.mode); return; }
  if (MODE !== "spieler") return;
  const t = e.target.closest("[data-ptab],[data-pact]"); if (!t) return;
  if (t.dataset.ptab){ ptab = t.dataset.ptab; return renderPlayer(); }
  const a = t.dataset.pact, p = Q.players.find(x => x.id === t.dataset.qid);
  switch (a){
    case "add": { const v = document.getElementById("qNew").value.trim(); if (!v) return; Q.players.push({id:"q" + Math.random().toString(36).slice(2,8), name:v, alive:true, ghost:true, claim:"", guess:"", note:""}); break; }
    case "alive": p.alive = !p.alive; p.ghost = true; break;
    case "guess": p.guess = p.guess === t.dataset.g ? "" : t.dataset.g; break;
    case "sure": { if (t.dataset.kind === "log"){ const e = Q.me.log[+t.dataset.qid]; e.sure = !e.sure; } else { const k = t.dataset.kind + "Sure"; p[k] = !p[k]; if (p.id === Q.meId && k === "claimSure") p.claimSure = true; } break; }
    case "up": { const i = Q.players.indexOf(p); if (i > 0) [Q.players[i-1], Q.players[i]] = [Q.players[i], Q.players[i-1]]; break; }
    case "del": Q.players = Q.players.filter(x => x !== p); break;
    case "script": Q.script = t.dataset.sid; break;
    case "log": { const v = document.getElementById("qLog").value.trim(); if (!v) return; Q.me.log.push({when: document.getElementById("qWhen").value.trim() || new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}), text:v, sure:true}); break; }
    case "takeShare": { const d = window._share; if (!d) return; const old = Q.players; const who = document.getElementById("qWho")?.value;
      if (who === "" || who === undefined){ document.getElementById("qWho")?.focus(); return; }
      Q.script = d.s; Q.custom = d.c || [];
      Q.players = d.p.map((n,i) => { const q = old.find(x => x.name === n) || {id:"q" + Math.random().toString(36).slice(2,8), name:n, alive:true, ghost:true, claim:"", guess:"", note:""};
        const dead = (d.x || []).includes(i); if (dead && q.alive) q.ghost = true; q.alive = !dead; return q; });
      Q.meId = Q.players[+who].id; if (Q.me.role && !Q.players[+who].claim){ Q.players[+who].claim = Q.me.role; Q.players[+who].claimSure = true; }
      window._share = null; ptab = "pme";
      try{ localStorage.setItem("locked", "1"); }catch(_){}
      break; }
    case "dropShare": window._share = null; break;
    case "paste": { const v = document.getElementById("qPaste").value.trim(); const i = v.indexOf("#aufbau-"); const d = i >= 0 ? readShare(v.slice(i)) : null; if (!d) return; window._share = d; break; }
    case "resetAsk": document.getElementById("qReset").innerHTML = `<button class="btn bad" data-pact="reset">Ja, wirklich leeren</button>`; return;
    case "reset": Q = qblank(); break;
    default: return;
  }
  qSave(); renderPlayer();
  if (a === "add") document.getElementById("qNew").focus();
});
document.addEventListener("change", e => {
  if (MODE !== "spieler") return;
  const d = e.target.dataset;
  if (d.qclaim){ const p = Q.players.find(x => x.id === d.qclaim); p.claim = e.target.value; if (p.id === Q.meId){ Q.me.role = p.claim; p.claimSure = true; } qSave(); return renderPlayer(); }
  if (d.qwho){ Q.meId = e.target.value || null; const p = meP(); if (p && !p.claim && Q.me.role){ p.claim = Q.me.role; p.claimSure = true; } qSave(); return renderPlayer(); }
  if (d.qghost){ Q.players.find(x => x.id === d.qghost).ghost = e.target.checked; return qSave(); }
  if (d.qme){ Q.me.role = e.target.value; const p = meP(); if (p){ p.claim = Q.me.role; p.claimSure = true; } qSave(); return renderPlayer(); }
});
document.addEventListener("input", e => {
  if (MODE !== "spieler") return;
  const d = e.target.dataset;
  if (d.qnote){ Q.players.find(x => x.id === d.qnote).note = e.target.value; qSave(); }
  if (d.qnotes){ Q.notes = e.target.value; qSave(); }
});
document.addEventListener("keydown", e => { if (MODE === "spieler" && e.key === "Enter" && e.target.id === "qNew"){ e.preventDefault(); document.querySelector('[data-pact="add"]').click(); } });

function shareLink(){
  const data = {s: S.script || "tb", c: S.script === "custom" ? (S.custom || []) : undefined, p: S.players.map(p => p.name), x: S.players.map((p,i) => p.alive ? -1 : i).filter(i => i >= 0)};
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.href.split("#")[0] + "#aufbau-" + b64;
}
function readShare(hash){
  const h = hash || location.hash; if (!h.startsWith("#aufbau-")) return null;
  try{ const b = h.slice(8).replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(_){ return null; }
}
function offerShare(){
  const d = readShare(); if (!d) return;
  history.replaceState(null, "", location.href.split("#")[0]);
  MODE = "spieler"; try{ localStorage.setItem("mode", "spieler"); }catch(_){}
  if (!Q) Q = qGet() || qblank();
  // Wer per Link beitritt, ist Spieler. Nur ein Gerät mit eigenem Spielleiter-Spiel darf ablehnen.
  if (!S.players.length) { try{ localStorage.setItem("locked", "1"); }catch(_){} }
  window._share = d; ptab = "ptable"; renderPlayer();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-reset]"); if (!b) return;
  const bar = document.getElementById("resetBar");
  if (b.dataset.reset === "ask"){ bar.hidden = false; bar.scrollIntoView({block:"nearest"}); return; }
  if (b.dataset.reset === "no"){ bar.hidden = true; return; }
  try{ ["grimoire","grimoireDemo","erkl","spieler","mode","grimTab","locked"].forEach(k => localStorage.removeItem(k)); }catch(_){}
  S = blank(); DEMO = false; Q = null; MODE = null; tab = "grim"; ptab = "ptable"; window._share = null;
  if (dbDoc) dbDoc.set({state: JSON.stringify(S), at: new Date().toISOString()}).catch(() => {});
  bar.hidden = true; document.getElementById("dlg").open && document.getElementById("dlg").close();
  render(); setSaved("zurückgesetzt");
});
